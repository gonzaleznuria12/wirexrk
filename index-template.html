<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <title>WireXRk</title>
  <meta name="description" content="WireXRk" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@3.0.3/dist/aframe-event-set-component.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script type="module" src="../../js/controller.js" defer></script>
  <script type="module" src="../../js/network.js" defer></script>
  <script type="module" src="../../js/packet.js" defer></script>
  <script type="module" src="../../js/dns.js" defer></script>

  <!-- Used for panels: router, switch, arp cache, dns cache, address labels, name of nodes,...  -->
  <script type="module" src="../../js/aframe-html.js" defer></script>

  <!-- Used for web browser of consoles, and for infoPanel. It has richer HTML features than aframe-html.js, allows styles,... -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="../../js/html_panel.js" defer></script>

  <script type="text/javascript">
    AFRAME.ASSETS_PATH = "../../assets";
  </script>

  <link rel="icon" href="data:,">
  <link rel="icon" href="../../favicon.ico" type="image/x-icon">


  <script>
    AFRAME.registerComponent('load-network-entity', {
      schema: {
        src: { type: 'string', default: 'network-entity.html' },
        insertPoint: { type: 'string', default: 'a-scene' } // where to insert the loaded HTML
      },

      init: function () {
        const data = this.data;
        const el = this.el;

        // Find the insertion point (defaults to the scene element)
        const insertionElement = data.insertPoint === 'a-scene' ?
          document.querySelector('a-scene') :
          document.querySelector(data.insertPoint);

        if (!insertionElement) {
          console.error('Insertion point not found:', data.insertPoint);
          return;
        }

        // Fetch the HTML content
        fetch(data.src)
          .then(response => {
            if (!response.ok) {
              throw new Error(`Failed to load HTML content: ${response.status} ${response.statusText}`);
            }
            return response.text();
          })
          .then(htmlContent => {
            // Create a temporary container to parse the HTML
            const tempContainer = document.createElement('div');
            tempContainer.innerHTML = htmlContent.trim();

            // Get all root elements from the loaded HTML
            while (tempContainer.firstChild) {
              insertionElement.appendChild(tempContainer.firstChild);
            }

            console.log('Network A-Frame entities in network-entity.html loaded successfully');
          })
          .catch(error => {
            console.error('Error loading HTML entity:', error);
          });
      }
    });
  </script>
</head>


<body>
  <div id="rewindOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 30, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 9999; align-items: center; justify-content: center; color: white; font-family: monospace; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
    ⏪ Rewinding...
  </div>

  <a-scene vr-controller-setup load-network-entity="src: ./network-entities.html">
    <!-- <a-scene> -->
    <a-assets timeout="20000">
      <img id="groundTexture" src="../../assets/floor.jpg" />
      <img id="skyTexture" src="../../assets/sky.png" />
      <audio id="packetIn" crossorigin="anonymous" src="../../assets/packetIn.mp3"></audio>
      <audio id="showLevels" crossorigin="anonymous" src="../../assets/showLevels.mp3"></audio>
      <audio id="showInfo" crossorigin="anonymous" src="../../assets/showInfo.mp3"></audio>
      <audio id="playPause" crossorigin="anonymous" src="../../assets/playPause.mp3"></audio>
      <a-asset-item id="computer" src="../../assets/computer/scene.gltf"></a-asset-item>
      <a-asset-item id="switch" src="../../assets/switch/switch2.glb"></a-asset-item>

      <a-asset-item id="router" src="../../assets/router/router2.glb"></a-asset-item>
      <a-asset-item id="hub" src="../../assets/hub/hub2.glb"></a-asset-item>
      <a-asset-item id="docker" src="../../assets/docker2/docker2.glb"></a-asset-item>
      <a-asset-item id="router-vxlan" src="../../assets/router/router2.glb"></a-asset-item>
      <a-asset-item id="switch-vlan" src="../../assets/server2/server2.glb"></a-asset-item>
    </a-assets>


    <a-cylinder id="ground" src="#groundTexture" radius="300" height="0.1"></a-cylinder>

    <!-- 360-degree image. -->
    <a-sky id="background" src="#skyTexture" theta-length="90" radius="300"></a-sky>


    <!-- Camera rig - parent for camera and controllers -->
    <a-entity id="cameraRig" position="0 10.6 0" my-keyboard-controls="enabled: true">
      <!-- Camera for desktop and VR with raycaster for interaction -->
      <a-entity id="camera" camera look-controls wasd-controls-enabled="false" position="0 0 30"
        raycaster="objects: .clickable; far: 20; interval: 100" cursor="fuse: false; rayOrigin: mouse">

        <a-entity id="controller" visible='true' controller='position:-0.5 -4.0 -5.5; scale:1 1 1'>
        </a-entity>

      </a-entity>



      <!-- Oculus/Meta Quest Touch Controllers -->
      <a-entity id="leftHand" class="controller" oculus-touch-controls="hand: left; model: true"
        laser-controls="hand: left"
        raycaster="objects: .clickable; showLine: true; lineColor: #FF0000; lineOpacity: 0.8"
        thumbstick-movement="hand: left; speed: 0.05" visible="false"></a-entity>

      <a-entity id="rightHand" class="controller" oculus-touch-controls="hand: right; model: true"
        laser-controls="hand: right"
        raycaster="objects: .clickable; showLine: true; lineColor: #0000FF; lineOpacity: 0.8"
        thumbstick-movement="hand: right; speed: 0.05" visible="false"></a-entity>
    </a-entity>






    <section style="display: inline-block; background: rgb(173, 169, 169); 
    color: #333333; border-radius: 1em; padding: 0.5rem; margin:0; accent-color: rgb(15, 106, 186);" id="gui-panel">

      <fieldset
        style="display: flex; flex-direction: row; justify-content: space-between; gap: 0.5rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 5px;">
        <!-- Botón settings -->
        <button id="settingsButton" class="clickable"
          style="color: white; border: none; border-radius: 8px; padding: 0.5rem 0.4rem; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s, opacity 0.2s;"
          onmouseover="this.style.opacity='0.8';" onmouseout="this.style.opacity='1';"
          onfocus="this.style.outline='2px solid white'; this.style.outlineOffset='2px';"
          onblur="this.style.outline='none';" onmousedown="this.style.transform='scale(0.95)';"
          onmouseup="this.style.transform='scale(1)';">
          ⚙️
        </button>



        <!-- Botón Rewind -->
        <div style="position:relative; display:inline-block;">
          <button id="rewindButton" class="clickable"
          style="color: white; border: none; border-radius: 8px; padding: 0.5rem 0.4rem; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s, opacity 0.2s;"
          onmouseover="this.style.opacity='0.8';" onmouseout="this.style.opacity='1';"
          onfocus="this.style.outline='2px solid white'; this.style.outlineOffset='2px';"
          onblur="this.style.outline='none';" onmousedown="this.style.transform='scale(0.95)';"
          onmouseup="this.style.transform='scale(1)';">
          ⏪
        </button>
          <span id="rewindBadge" style="display:none; position:absolute; top:-0.5em; right:-0.4em; background:#c0392b; color:white; border-radius:0.8em; font-size:0.65rem; padding:0.1em 0.35em; font-weight:bold; pointer-events:none; line-height:1.2;"></span>
        </div>

        <!-- Botón PlayPause -->
        <button id="playPauseButton" class="clickable"
          style="color: white; border: none; border-radius: 8px; padding: 0.5rem 0.4rem; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s, opacity 0.2s;"
          onmouseover="this.style.opacity='0.8';" onmouseout="this.style.opacity='1';"
          onfocus="this.style.outline='2px solid white'; this.style.outlineOffset='2px';"
          onblur="this.style.outline='none';" onmousedown="this.style.transform='scale(0.95)';"
          onmouseup="this.style.transform='scale(1)';">
          ▶️
        </button>


        <!-- Botón Fast-Forward -->
        <div style="position:relative; display:inline-block;">
          <button id="ffButton" class="clickable"
          style="color: white; border: none; border-radius: 8px; padding: 0.5rem 0.4rem; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s, opacity 0.2s;"
          onmouseover="this.style.opacity='0.8';" onmouseout="this.style.opacity='1';"
          onfocus="this.style.outline='2px solid white'; this.style.outlineOffset='2px';"
          onblur="this.style.outline='none';" onmousedown="this.style.transform='scale(0.95)';"
          onmouseup="this.style.transform='scale(1)';">
          ⏩
        </button>
          <span id="ffBadge" style="display:none; position:absolute; top:-0.5em; right:-0.4em; background:#c0392b; color:white; border-radius:0.8em; font-size:0.65rem; padding:0.1em 0.35em; font-weight:bold; pointer-events:none; line-height:1.2;"></span>
        </div>

        <!-- Botón Stop -->
        <button id="stopButton" class="clickable"
          style="color: white; border: none; border-radius: 8px; padding: 0.5rem 0.4rem; font-size: 1.2rem; cursor: pointer; transition: transform 0.2s, opacity 0.2s;"
          onmouseover="this.style.opacity='0.5';" onmouseout="this.style.opacity='1';"
          onfocus="this.style.outline='2px solid white'; this.style.outlineOffset='2px';"
          onblur="this.style.outline='none';" onmousedown="this.style.transform='scale(0.95)';"
          onmouseup="this.style.transform='scale(1)';">
          ⏹️
        </button>
      </fieldset>



      <fieldset style="display: flex; flex-direction: row; gap: 0.5rem; padding: 0.5rem; 
    border: 1px solid #ccc; border-radius: 5px;
    ">

        <label for="slider">Speed:</label>
        <input type="range" id="slider" min="1" max="100" value="50" step="1" style="background: rgb(173, 169, 169); 
    color: #333333;">
      </fieldset>

    </section>


    <div id="htmltemplates">
    </div>

  </a-scene>

  <!-- HTML Content to Render infoPanel.html -->
  <div id="html-content">
    <div class="browser-content">
      <div class="demo-content">
        <img src="../../assets/wirexrk.png" alt="WireXRk logo" width=310 height=100>
        <hr>
        <div class="feature-section">
          <!-- insert here infoPanel.html -->
        </div>
        <hr>
      </div>
    </div>
  </div>

  <script>
    // Loads infoPanel.html and shows it in the scene
    document.addEventListener('DOMContentLoaded', function () {
      // Fetch the info panel content
      fetch('./infoPanel.html')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.text();
        })
        .then(data => {
          // Get reference to the feature section and insert the info panel content
          const featureSection = document.querySelector('.feature-section');
          featureSection.innerHTML = data;

          // Now that info panel is loaded, add the A-Frame HTML panel entity
          addHtmlPanelToScene();

          // Show the main content
          document.getElementById('html-content').style.display = 'block';
        })
        .catch(error => {
          console.error('Error loading info panel:', error);
          // Show error message or handle gracefully
          document.getElementById('html-content').style.display = 'block';
          document.querySelector('.feature-section').innerHTML = '<p>Error loading information. Please refresh the page.</p>';
        });
    });

    // Function to add the HTML panel to the A-Frame scene
    function addHtmlPanelToScene() {
      // Get reference to the A-Frame scene
      const scene = document.querySelector('a-scene');

      // Create the HTML panel entity
      const htmlPanelEntity = document.createElement('a-entity');
      htmlPanelEntity.setAttribute('id', 'html-panel');
      htmlPanelEntity.setAttribute('position', '-20 10.6 -15');
      htmlPanelEntity.setAttribute('scale', '40 40 40');
      htmlPanelEntity.setAttribute('look-at', '[camera]');

      // Create the HTML container entity
      const htmlContainerEntity = document.createElement('a-entity');
      htmlContainerEntity.setAttribute('id', 'html-container');
      htmlContainerEntity.setAttribute('class', 'clickable');
      htmlContainerEntity.setAttribute('html-panel', '');
      htmlContainerEntity.setAttribute('width', '');
      htmlContainerEntity.setAttribute('position', '0 0 0.002');
      htmlContainerEntity.setAttribute('scale', '1 1 1');

      // Add onclick event
      htmlContainerEntity.addEventListener('click', function () {
        window.open('https://mobiquo.gsyc.urjc.es/wirexrk', '_blank');
      });

      // Append container to panel
      htmlPanelEntity.appendChild(htmlContainerEntity);

      // Add the panel to the scene
      scene.appendChild(htmlPanelEntity);

      console.log('HTML info panel added to the scene');
    }
  </script>

</body>

</html>
